<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Grace</title>
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<header>
		<div class="titlebar"><strong id="project-title">Grace</strong></div>
		<nav aria-label="Grace menus">
			<details><summary><u>F</u>ile</summary><div class="menu">
				<button data-action="new">New</button>
				<button data-action="open">Open...</button>
				<button data-action="save" data-edit>Save</button>
				<button data-action="save-as" data-edit>Save as...</button>
				<button data-action="revert">Revert to saved</button>
				<hr>
				<button data-action="print-setup" data-edit>Print setup...</button>
				<button data-action="print" data-edit>Print</button>
			</div></details>
			<details><summary><u>E</u>dit</summary><div class="menu">
				<button data-action="sets">Data sets...</button>
				<button data-action="autoscale-dialog" data-edit>Autoscale graphs...</button>
			</div></details>
			<details><summary><u>D</u>ata</summary><div class="menu">
				<button data-action="import" data-edit>Import ASCII...</button>
				<button data-action="svg" data-edit>Export SVG...</button>
			</div></details>
			<details><summary><u>P</u>lot</summary><div class="menu">
				<button data-action="graph" data-edit>Graph appearance...</button>
				<button data-action="set" data-edit>Set appearance...</button>
				<button data-action="axis" data-edit>Axis properties...</button>
			</div></details>
			<details><summary><u>V</u>iew</summary><div class="menu">
				<button data-action="locator">Show/hide locator bar</button>
				<button data-action="status">Show/hide status bar</button>
				<button data-action="toolbar">Show/hide tool bar</button>
				<button data-action="redraw">Redraw</button>
			</div></details>
			<details><summary><u>W</u>indow</summary><div class="menu">
				<button data-action="graphs">Graphs...</button>
				<button data-action="diagnostics">Console...</button>
			</div></details>
			<details><summary><u>H</u>elp</summary><div class="menu">
				<a href="https://github.com/vosslab/xmgrace/blob/main/README.md#make-the-cooling-plot" target="_blank" rel="noopener">Browser guide</a>
				<a href="https://plasma-gate.weizmann.ac.il/Grace/doc/UsersGuide.html" target="_blank" rel="noopener">Desktop reference</a>
				<button data-action="examples">Examples...</button>
				<a href="./LICENSE.GPL-2.0-or-later" target="_blank" rel="noopener">License terms</a>
				<a href="https://github.com/vosslab/xmgrace" target="_blank" rel="noopener">Source code</a>
				<button data-action="about">About Grace...</button>
			</div></details>
		</nav>
		<div class="locator" id="locator-bar">
			<label>Graph <select id="graph-select" aria-label="Active graph"></select></label>
			<output id="locator">G0: X, Y</output>
		</div>
	</header>
	<main>
		<aside id="toolbar" aria-label="Grace toolbar">
			<button data-action="draw" title="Redraw">Draw</button>
			<button data-action="zoom" data-edit title="Zoom to a region" aria-pressed="false">Z</button>
			<button data-action="zoom-in" data-edit title="Zoom in">+</button>
			<button data-action="zoom-out" data-edit title="Zoom out">&minus;</button>
			<button data-action="autoscale" data-edit title="Autoscale both axes">AS</button>
			<button data-action="autoscale-x" data-edit title="Autoscale X axis">AX</button>
			<button data-action="autoscale-y" data-edit title="Autoscale Y axis">AY</button>
			<div class="arrows">
				<button data-action="left" data-edit aria-label="Scroll left">&larr;</button>
				<button data-action="right" data-edit aria-label="Scroll right">&rarr;</button>
				<button data-action="up" data-edit aria-label="Scroll up">&uarr;</button>
				<button data-action="down" data-edit aria-label="Scroll down">&darr;</button>
			</div>
		</aside>
		<section id="workspace" aria-label="Plot workspace">
			<div id="diagnostic-banner" hidden><strong>Read-only preview.</strong> <button data-action="diagnostics">View diagnostics...</button> <button data-action="original">Download original</button></div>
			<div id="canvas"><img id="plot" alt="Grace project plot" draggable="false"><div id="rubber-band" hidden></div></div>
		</section>
	</main>
	<footer id="status-bar" role="status">Loading Grace...</footer>
	<input id="project-file" type="file" accept=".agr" hidden>
	<input id="data-file" type="file" accept=".dat,.txt,.csv,.tsv" hidden>
	<dialog id="properties" aria-labelledby="dialog-title">
		<h2 id="dialog-title"></h2>
		<form id="dialog-form">
			<div id="dialog-content"></div>
			<p id="dialog-error" role="alert" hidden></p>
			<div class="dialog-buttons">
				<button type="submit" value="accept">Accept</button>
				<button type="submit" value="apply">Apply</button>
				<button type="button" data-action="close">Close</button>
			</div>
		</form>
	</dialog>
	<script type="module" src="./main.js"></script>
</body>
</html>
