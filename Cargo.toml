[package]
name = "grace"
version = "26.11.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-2.0-or-later"

[lib]
path = "rust/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = "*"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "*"
