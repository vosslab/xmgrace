name: Deploy GitHub Pages
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && 'Publish GitHub Pages' ||
  'Validate GitHub Pages build' }} for ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual deployment must finish even when verification starts for a newer push.
  group: >-
    github-pages-${{ github.event_name == 'workflow_dispatch' && 'publish' ||
    format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Update this after local maintenance validates a newer Node major.
          node-version: 26
          cache: npm
      - run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.100.0
      - run: cargo install wasm-pack --version 0.15.1 --locked
      - run: npm ci --no-audit
      - run: ./build_github_pages.sh
      - run: cargo test --locked
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:playwright
      - uses: actions/configure-pages@v6
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
